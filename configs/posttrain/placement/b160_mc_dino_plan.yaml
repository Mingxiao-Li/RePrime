# Max-cosine control (old V3 style) on the official data: DINOv2 plan-paired.
_base_: ../_base.yaml
train:
  compile: false
alignment:
  enabled: true
  method: ot_guided
  target: plan_paired
  pairing: argmax
  loss_form: maxcos
  img_size: 256
  block: 8
  weight: 1.0
  start_step: 250
  ramp_steps: 100
  end_step: 2500
