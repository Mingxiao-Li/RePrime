# V4a: self-target representation alignment (no pairing).
# Aligns block-8 patch hidden states with DINOv2 patch features of the
# generated image itself. Targets are no_grad; the head is training-only.
_base_: ../_base.yaml
train:
  compile: false
alignment:
  enabled: true
  method: ot_guided
  target: self
  block: 8
  weight: 1.0
  start_step: 250
  ramp_steps: 100
  end_step: 2500
  target_encoder: vit_large_patch14_dinov2.lvd142m
