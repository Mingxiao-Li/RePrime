# V2: class-pooled alignment -- no per-sample pairing; each generated patch
# matches the best token over a subset of its class's real-image pool.
_base_: ../_base.yaml
train:
  compile: false
alignment:
  enabled: true
  method: ot_guided
  target: pooled
  pool_size: 16
  block: 8
  weight: 1.0
  start_step: 250
  ramp_steps: 100
  end_step: 2500
  target_encoder: vit_large_patch14_dinov2.lvd142m
