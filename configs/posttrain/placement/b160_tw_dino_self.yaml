# Token-wise REPA (DINOv2 224 -> 16x16 tokens) target=self.
_base_: ../_base.yaml
train:
  compile: false
alignment:
  enabled: true
  method: ot_guided
  target: self
  loss_form: tokenwise
  tokenwise_interp: false
  img_size: 224
  block: 8
  weight: 1.0
  start_step: 250
  ramp_steps: 100
  end_step: 2500
