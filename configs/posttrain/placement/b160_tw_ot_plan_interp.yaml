# Token-wise alignment in the OT feature space (ConvNeXt stage_2 14x14 -> 16x16).
_base_: ../_base.yaml
train:
  compile: false
alignment:
  enabled: true
  method: ot_guided
  target: plan_paired
  loss_form: tokenwise
  tokenwise_interp: true
  feature_extractor: ot_stack
  ot_family: convnext
  ot_token_key: convenxt_stage_2
  block: 8
  weight: 1.0
  start_step: 250
  ramp_steps: 100
  end_step: 2500
