# Ablation: align to the ResNet-MAE space used by the OT stage (160 epochs).

_base_: _base.yaml
# Alignment-space ablation at FULL budget (160 epochs, matching s1-repa160):
# ResNet-MAE layer2_blk4 spatial tokens (same-space, reconstruction family).
train:
  compile: false
  measure_flops: false
  keep_n_ckpts: 8
  milestone_interval: 5
  print_freq: 100
data:
  encoder_cache: assets/ot/representations
alignment:
  enabled: true
  method: ot_guided
  feature_extractor: ot_stack
  ot_family: mae
  ot_token_key: layer2_blk4
  target: self
  loss_form: tokenwise
  tokenwise_interp: true
  img_size: 224
  block: 5
  weight: 0.5
  start_step: 0
  ramp_steps: 0
  end_step: 0
  head_lr: 0.0001
