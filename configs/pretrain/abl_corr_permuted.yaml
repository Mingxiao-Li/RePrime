# Correspondence control: own image with permuted tokens (10 epochs).

_base_: _base.yaml
# E2 (10 epochs on 2xH200): correspondence control on the paired path.
# Identical to b160_repa200_full.yaml (RePrime, block 5, lambda 0.5, full window)
# up to its 10-epoch milestone (step 12,510), except alignment.e2_mode and the
# 2-GPU accumulation (micro 64 x accum 8 x 2 ranks = global batch 1024, unchanged).
train:
  epochs: 10
  allow_short: true
  gradient_accumulation_steps: 8
  compile: false
  measure_flops: false
  keep_n_ckpts: 4
  milestone_interval: 5
  print_freq: 50
alignment:
  enabled: true
  method: ot_guided
  feature_extractor: dinov2
  target_encoder: vit_large_patch14_dinov2.lvd142m
  target: self
  loss_form: tokenwise
  tokenwise_interp: false
  img_size: 224
  block: 5
  weight: 0.5
  start_step: 0
  ramp_steps: 0
  end_step: 0
  head_lr: 0.0001
  e2_mode: self_permuted
  e2_encoder_cache: assets/ot/representations
  e2_data_path: data/imagenet
