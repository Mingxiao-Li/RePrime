# RePrime-B, block 8, extended to 200 priming epochs (budget-curve arm).

_base_: _base.yaml
# REPA with optimal block 8 (50% depth), extended to 200 epochs (250,200 updates).
# Milestone interval 5 (same as repa200/block5) for budget curve comparison.
train:
  epochs: 200
  allow_long: true
  compile: false
  measure_flops: false
  keep_n_ckpts: 8
  milestone_interval: 5
  print_freq: 100
alignment:
  enabled: true
  method: ot_guided
  feature_extractor: dinov2
  target_encoder: vit_large_patch14_dinov2.lvd142m
  target: self
  loss_form: tokenwise
  tokenwise_interp: false
  img_size: 224
  block: 8
  weight: 0.5
  start_step: 0
  ramp_steps: 0
  end_step: 0
  head_lr: 0.0001
